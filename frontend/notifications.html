<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications · Project Guidance &amp; Mentoring Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="app-body" data-page="notifications" data-requires-auth="true">

  <div id="app-shell"></div>

  <main id="page-content" class="page-content">

    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="dashboard.html">Home</a></li>
        <li aria-current="page">Notifications</li>
      </ol>
    </nav>

    <header class="page-header">
      <div>
        <h1>Notifications</h1>
        <p class="page-subtitle">
          Every action that affects you — project reviews, mentoring requests,
          and session changes — appears here.
        </p>
      </div>
      <div class="page-header-actions">
        <button type="button" class="btn btn-outline" id="btn-mark-all-read">
          Mark all as read
        </button>
        <button type="button" class="btn btn-ghost" id="btn-clear-all">
          Clear all
        </button>
      </div>
    </header>

    <!-- Filters -->
    <section class="card filter-bar">
      <div class="filter-row">
        <div class="filter-field">
          <label for="notif-search" class="sr-only">Search notifications</label>
          <input type="search" id="notif-search"
                 placeholder="Search notifications…" />
        </div>

        <div class="filter-field">
          <label for="notif-type">Type</label>
          <select id="notif-type">
            <option value="">All types</option>
            <option value="project">Project</option>
            <option value="mentoring">Mentoring</option>
            <option value="session">Sessions</option>
            <option value="message">Messages</option>
            <option value="account">Account</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="notif-read">Read status</label>
          <select id="notif-read">
            <option value="">All</option>
            <option value="unread">Unread only</option>
            <option value="read">Read only</option>
          </select>
        </div>

        <div class="filter-field filter-field--end">
          <button type="button" class="btn btn-ghost" id="notif-clear-filters">
            Clear
          </button>
        </div>
      </div>
    </section>

    <p class="list-count" id="notif-count">0 notifications</p>

    <section class="card notification-list-card">
      <ul class="notification-list" id="notification-list" aria-live="polite"></ul>

      <div class="empty-state" id="notif-empty" hidden>
        <div class="empty-illustration" aria-hidden="true">🔔</div>
        <h2>No notifications</h2>
        <p>You're all caught up. New activity will appear here.</p>
      </div>
    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    // The notifications page itself just renders the full list.
    // The topbar bell (drawn by app.js) uses the same module in dropdown mode.
    document.addEventListener('DOMContentLoaded', function () {
      if (window.PGMPNotifications && window.PGMPNotifications.renderPage) {
        window.PGMPNotifications.renderPage();
      }
    });
  </script>
</body>
</html>
