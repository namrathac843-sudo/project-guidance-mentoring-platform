<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages · Project Guidance &amp; Mentoring Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="app-body" data-page="messages" data-requires-auth="true">

  <div id="app-shell"></div>

  <main id="page-content" class="page-content page-content--flush">

    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="dashboard.html">Home</a></li>
        <li aria-current="page">Messages</li>
      </ol>
    </nav>

    <div class="chat-layout" id="chat-layout">

      <!-- ========================================================= -->
      <!-- Conversation list                                         -->
      <!-- ========================================================= -->
      <aside class="chat-sidebar card" id="chat-sidebar">
        <header class="chat-sidebar-head">
          <h1 class="chat-title">Messages</h1>
          <button type="button" class="icon-btn" id="btn-new-chat"
                  aria-label="Start a new conversation" title="New conversation">
            ＋
          </button>
        </header>

        <div class="chat-search">
          <label for="chat-search" class="sr-only">Search conversations</label>
          <input type="search" id="chat-search" placeholder="Search conversations…" />
        </div>

        <ul class="conversation-list" id="conversation-list" aria-live="polite"></ul>

        <div class="empty-state empty-state--small" id="conversations-empty" hidden>
          <p>No conversations yet.</p>
          <button type="button" class="btn btn-primary btn-sm" id="btn-start-chat-empty">
            Start a conversation
          </button>
        </div>
      </aside>

      <!-- ========================================================= -->
      <!-- Thread                                                    -->
      <!-- ========================================================= -->
      <section class="chat-main card" id="chat-main">

        <!-- No conversation selected -->
        <div class="chat-empty" id="chat-empty">
          <div class="empty-illustration" aria-hidden="true">💬</div>
          <h2>Select a conversation</h2>
          <p>Choose a conversation from the list, or start a new one.</p>
          <button type="button" class="btn btn-primary" id="btn-start-chat">
            Start a conversation
          </button>
        </div>

        <!-- Active conversation -->
        <div class="chat-active" id="chat-active" hidden>
          <header class="chat-head">
            <button type="button" class="icon-btn chat-back" id="chat-back"
                    aria-label="Back to conversations">←</button>
            <div class="chat-avatar" id="chat-avatar">A</div>
            <div class="chat-user">
              <strong id="chat-user-name">—</strong>
              <small id="chat-user-meta"></small>
            </div>
            <div class="chat-actions">
              <button type="button" class="icon-btn" id="chat-view-profile"
                      title="View profile" aria-label="View profile">👤</button>
            </div>
          </header>

          <div class="chat-thread" id="chat-thread" aria-live="polite"></div>

          <form class="chat-composer" id="chat-composer" novalidate>
            <label for="chat-input" class="sr-only">Message</label>
            <textarea id="chat-input" rows="1" maxlength="2000"
                      placeholder="Type a message…"></textarea>
            <button type="submit" class="btn btn-primary" id="btn-send-message"
                    aria-label="Send message">Send</button>
          </form>
        </div>

      </section>

    </div>

  </main>

  <!-- ============================================================== -->
  <!-- Contact picker (start a new conversation)                        -->
  <!-- ============================================================== -->
  <div class="modal-backdrop" id="modal-contacts" hidden>
    <div class="modal" role="dialog" aria-modal="true"
         aria-labelledby="modal-contacts-title">
      <header class="modal-header">
        <h2 id="modal-contacts-title">Start a conversation</h2>
        <button type="button" class="icon-btn modal-close" aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <div class="form-group">
          <label for="contact-search" class="sr-only">Search contacts</label>
          <input type="search" id="contact-search"
                 placeholder="Search by name, role, or department…" />
        </div>
        <ul class="contact-list" id="contact-list"></ul>
        <div class="empty-state empty-state--small" id="contacts-empty" hidden>
          <p>No contacts available.</p>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost modal-close">Close</button>
      </footer>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
